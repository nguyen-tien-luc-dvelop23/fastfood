<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<section class="navbar">
    <div class="container">
        <div class="logo">
            <a href="index.html">
                <img src="images/logo.png" class="img-responsive">
            </a>
        </div>

        <div class="menu text-right">
            <ul>
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="foods.html">Món ăn</a></li>
                <li><a href="cart.html">Giỏ hàng</a></li>
            </ul>
        </div>
        <div class="clearfix"></div>
    </div>
</section>

<section class="food-menu">
    <div class="container">
        <h2 class="text-center">🛒 Giỏ hàng</h2>

        <div id="cart-items"></div>

        <h3 class="text-right">
            Tổng tiền: <span id="total-price">0 ₫</span>
        </h3>

        <div class="text-center">
            <a href="foods.html" class="btn btn-primary">Tiếp tục mua</a>
            <a href="order.html" class="btn btn-primary">Thanh toán</a>
        </div>
    </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const cartItemsDiv = document.getElementById("cart-items");
    const totalSpan = document.getElementById("total-price");

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    if (cart.length === 0) {
        cartItemsDiv.innerHTML = "<p>🛑 Giỏ hàng trống</p>";
        return;
    }

    let total = 0;
    cartItemsDiv.innerHTML = "";

    cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;

        cartItemsDiv.innerHTML += `
            <div class="food-menu-box">
                <div class="food-menu-img">
                    <img src="${item.image}" class="img-responsive img-curve">
                </div>

                <div class="food-menu-desc">
                    <h4>${item.name}</h4>
                    <p class="food-price">${item.price.toLocaleString("vi-VN")} ₫</p>
                    <p>Số lượng: ${item.quantity}</p>
                    <p><strong>Thành tiền:</strong> ${itemTotal.toLocaleString("vi-VN")} ₫</p>

                    <button onclick="changeQty(${index}, -1)">−</button>
                    <button onclick="changeQty(${index}, 1)">+</button>
                    <button onclick="removeItem(${index})">❌ Xóa</button>
                </div>
            </div>
        `;
    });

    totalSpan.innerText = total.toLocaleString("vi-VN") + " ₫";

    window.changeQty = function (index, delta) {
        cart[index].quantity += delta;
        if (cart[index].quantity <= 0) {
            cart.splice(index, 1);
        }
        save();
    };

    window.removeItem = function (index) {
        cart.splice(index, 1);
        save();
    };

    function save() {
        localStorage.setItem("cart", JSON.stringify(cart));
        location.reload();
    }
});
</script>

</body>
</html>
